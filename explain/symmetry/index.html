<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Integrated Clock-Face</title>
<meta name="description" content="An eight-node network: departures at irregular minutes, a clock-face timetable, and an integrated clock-face timetable where all lines meet at the hubs.">
<style>
:root{--ink:#1d2433;--mute:#5d6678;--line:#dfe3ea;--bg:#f6f7fa;--card:#fff;--soft:#eef1f6;--link:#1d4ed8;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--rail:#d32f2f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8ebf2;--mute:#a3abba;--line:#2e3646;--bg:#161b25;--card:#1f2633;--soft:#262e3d;--link:#93b4ff;--ok:#22c55e;--bad:#f87171;--warn:#fbbf24;--rail:#ef5350}}
:root[data-theme="dark"]{--ink:#e8ebf2;--mute:#a3abba;--line:#2e3646;--bg:#161b25;--card:#1f2633;--soft:#262e3d;--link:#93b4ff;--ok:#22c55e;--bad:#f87171;--warn:#fbbf24;--rail:#ef5350}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:22px 16px 40px}
a{color:var(--link)}
h1{font-size:24px;margin:6px 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 14px system-ui,sans-serif;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cap{padding:10px 16px;font-size:14.5px;border-bottom:1px solid var(--line)}
svg{display:block;width:100%;height:auto;background:var(--soft)}
svg text{font-family:system-ui,sans-serif}
.bar{padding:12px 16px 14px;display:grid;gap:6px}
.r{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.k{font-weight:800;font-size:17px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tt{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace}
.tt span{display:inline-block;margin-right:12px}
.lab{color:var(--mute);font-size:13px;min-width:90px}
</style>
</head>
<body>
<main>
<a href="../../index.html">← back</a>
<h1>Clock-face and integrated clock-face</h1>
<div class="tabs"><button data-s="0" class="on">No clock-face</button><button data-s="1">Clock-face</button><button data-s="2">Integrated clock-face</button></div>
<div class="stage">
<div class="cap" id="cap"></div>
<svg id="sv" viewBox="0 0 760 600" role="img" aria-label="Network of eight stations A to H with trains in both directions on every link"></svg>
<div class="bar">
<div class="r"><span class="lab">Timed changes</span><span class="k" id="score"></span></div>
<div class="r"><span class="lab">A → B leaves</span><span class="tt" id="tt"></span><span class="k" id="mem"></span></div>
</div>
</div>
</main>
<script>
const NS='http://www.w3.org/2000/svg',sv=document.getElementById('sv');
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||sv).appendChild(e);return e;};
const mod=(x,n)=>((x%n)+n)%n,mm=(x)=>':'+String(mod(Math.round(x),60)).padStart(2,'0');
const hm=(x)=>{const t=420+x;return Math.floor(t/60)+':'+String(mod(Math.round(t),60)).padStart(2,'0');};   // minute 0 = 7:00
// network of Figure 13 (Castroviejo Bravo): link travel times now -> adjusted for the integrated clock-face timetable
const N={A:[110,110],B:[330,170],C:[650,110],D:[170,320],E:[550,340],F:[350,430],G:[170,520],H:[610,520]};
const SIDE={A:'n',B:'n',C:'n',D:'w',E:'e',F:'s',G:'s',H:'s'};   // where each station's label goes
const E=[['A','B',42,45],['A','D',40,45],['B','C',63,60],['B','D',36,30],['B','E',49,60],['C','E',71,60],
         ['D','F',39,30],['D','G',61,60],['E','F',64,60],['E','H',58,60],['F','G',30,30],['F','H',72,60],['G','H',93,90]];
// integrated: the minute at which all trains are in each hub (A: two hubs, its links take 45')
const HUB={A:[15,45],B:[30],C:[30],D:[0],E:[30],F:[30],G:[0],H:[30]};
const LC=240,DW=6,TOL=4;          // animation cycle 4 h; trains stop 6' (pass time +-3'); a change is timed if both trains are in the station together
const IRR=[[0,52,119,181],[0,67,121,186],[0,58,113,177],[0,63,128,171],[0,49,117,183]];
const CAP=['Each line leaves at different minutes every hour: hard to remember, and changes work only by chance.',
 'Each line leaves at the same minute every hour (clock-face): easy to remember, but changes still work only by chance.',
 'Integrated clock-face: travel times adjusted to 30′, 60′ or 90′ (45′ at A), so all trains meet in every hub at the same minutes and every change works.'];
const deg={};for(const [a,b] of E){deg[a]=(deg[a]||0)+1;deg[b]=(deg[b]||0)+1;}
const TOT=Object.values(deg).reduce((s,d)=>s+d*(d-1),0);
let T=0,last=0,dyn=null;
function build(i){sv.innerHTML='';T=0;
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.s===i));
 document.getElementById('cap').textContent=CAP[i];
 // trains: per link and direction, the pass times at its first station within the 4-hour cycle
 const tr=[];
 E.forEach(([a,b,t0,t1],j)=>{const tt=i===2?t1:t0;
  for(const [x,y,s] of [[a,b,0],[b,a,1]]){let p;
   if(i===2)p=x!=='A'?[0,60,120,180].map(k=>HUB[x][0]+k):[0,60,120,180].map(k=>mod(HUB[y][0]-tt,60)+k);
   else{const f=mod(j*23+7+s*31,60);p=(i===1?[0,60,120,180]:IRR[(j+s)%5]).map(k=>f+k);}
   tr.push({e:j,x,y,tt,p,pts:[N[x],N[y]]});}});
 // timed changes at each station: arriving on one link, leaving on another; every arrival within 4' of a departure
 const res={};let good=0;
 for(const n of Object.keys(N)){let ok=0;
  for(const a of tr.filter(t=>t.y===n))for(const d of tr.filter(t=>t.x===n&&t.e!==a.e))
   if(a.p.every(q=>d.p.some(r=>Math.abs(mod(r-(q+a.tt)+LC/2,LC)-LC/2)<=TOL)))ok++;
  res[n]=ok;good+=ok;}
 const sEl=document.getElementById('score');sEl.textContent=`${good} / ${TOT}`;sEl.className='k '+(good===TOT?'ok':'bad');
 const ab=tr.find(t=>t.x==='A'&&t.y==='B');
 document.getElementById('tt').innerHTML=ab.p.map(q=>`<span>${hm(q)}</span>`).join('');
 const mEl=document.getElementById('mem');mEl.textContent=i?'✓ same minute':'✗';mEl.className='k '+(i?'ok':'bad');
 const gL=el('g',{}),gT=el('g',{}),gP=el('g',{}),gN=el('g',{});   // links, trains, travel-time pills, stations
 E.forEach(([a,b,t0,t1])=>{const [ax,ay]=N[a],[bx,by]=N[b];
  el('line',{x1:ax,y1:ay,x2:bx,y2:by,stroke:'var(--rail)','stroke-width':6,'stroke-linecap':'round',opacity:.3},gL);
  const mx=(ax+bx)/2,my=(ay+by)/2,pl=el('rect',{rx:11,height:22,y:my-11,fill:'var(--card)',stroke:'var(--line)'},gP);
  const tx=el('text',{x:mx,y:my+5.5,'text-anchor':'middle','font-size':15,'font-weight':800,fill:'var(--ink)'},gP);
  tx.textContent=(i===2?t1:t0)+'′';
  if(i===2&&t1!==t0){const s=el('tspan',{'font-size':12,'font-weight':600,fill:t1>t0?'var(--warn)':'var(--ok)',dx:3},tx);s.textContent=(t1>t0?'+':'−')+Math.abs(t1-t0);}
  const w=tx.getComputedTextLength()+16;pl.setAttribute('x',mx-w/2);pl.setAttribute('width',w);});
 for(const t of tr)t.r=el('rect',{width:24,height:10,rx:3,fill:'var(--rail)',stroke:'var(--card)','stroke-width':1.5,opacity:0},gT);
 const hubs=[];
 for(const n of Object.keys(N)){const [x,y]=N[n],g=el('g',{transform:`translate(${x},${y})`},gN);
  const ring=el('circle',{r:33,fill:'none','stroke-width':5,opacity:0},g);
  el('circle',{r:25,fill:'var(--card)',stroke:'var(--ink)','stroke-width':2.2},g);
  for(let k=0;k<12;k++){const a=k/12*2*Math.PI;el('line',{x1:Math.sin(a)*20,y1:-Math.cos(a)*20,x2:Math.sin(a)*24,y2:-Math.cos(a)*24,stroke:'var(--mute)','stroke-width':1.2},g);}
  if(i===2)for(const h of HUB[n]){const b=h/60*2*Math.PI;el('line',{x1:0,y1:0,x2:Math.sin(b)*19,y2:-Math.cos(b)*19,stroke:'var(--ink)','stroke-width':4.5,'stroke-linecap':'round'},g);}
  const mh=el('line',{x1:0,y1:0,x2:0,y2:-21,stroke:'var(--bad)','stroke-width':2,'stroke-linecap':'round'},g);
  el('circle',{r:3,fill:'var(--ink)'},g);
  const need=deg[n]*(deg[n]-1),sd=SIDE[n];
  const lb=el('g',{},g),pr=el('rect',{rx:13,height:26,fill:'var(--ink)'},lb);
  const t1=el('text',{y:5.5,'font-size':15,'font-weight':800,fill:'var(--bg)'},lb);t1.textContent=n+(i===2?'  '+HUB[n].map(mm).join(' '):'');
  const t2=el('tspan',{dx:8,'font-size':13,fill:res[n]===need?'var(--ok)':'var(--bad)'},t1);t2.textContent=`${res[n]}/${need}`;
  const w=t1.getComputedTextLength()+22;t1.setAttribute('x',-w/2+11);pr.setAttribute('x',-w/2);pr.setAttribute('width',w);pr.setAttribute('y',-13);
  const [lx,ly]=sd==='n'?[0,-50]:sd==='s'?[0,50]:sd==='w'?[-38-w/2,0]:[38+w/2,0];
  lb.setAttribute('transform',`translate(${lx},${ly})`);
  hubs.push({n,mh,ring});}
 dyn=(m)=>{const at={};
  for(const t of tr){let pos=null;
   for(const q of t.p){const u=mod(m-(q-DW/2),LC);if(u>t.tt+DW)continue;
    if(u<=DW){pos=t.pts[0];(at[t.x]=at[t.x]||new Set()).add(t.e);}
    else if(u>=t.tt){pos=t.pts[1];(at[t.y]=at[t.y]||new Set()).add(t.e);}
    else{const f=(u-DW)/(t.tt-DW),[a,b]=t.pts;pos=[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}
    break;}
   if(!pos){t.r.setAttribute('opacity',0);continue;}
   const [a,b]=t.pts,ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI,ox=-(b[1]-a[1]),oy=b[0]-a[0],L=Math.hypot(ox,oy);
   t.r.setAttribute('opacity',1);t.r.setAttribute('transform',`translate(${pos[0]+ox/L*8},${pos[1]+oy/L*8}) rotate(${ang}) translate(-12,-5)`);}
  for(const hb of hubs){const a=mod(m,60)/60*2*Math.PI;hb.mh.setAttribute('x2',Math.sin(a)*21);hb.mh.setAttribute('y2',-Math.cos(a)*21);
   const k=at[hb.n]?at[hb.n].size:0;
   hb.ring.setAttribute('opacity',k?.9:0);hb.ring.setAttribute('stroke',k>=2?'var(--ok)':'var(--bad)');}};}
function frame(ts){const dt=last?(ts-last)/1000:0;last=ts;T+=dt*4;if(dyn)dyn(T);requestAnimationFrame(frame);}   // 4 timetable minutes per second
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{build(+b.dataset.s);history.replaceState(null,'','#'+(+b.dataset.s+1));});
build(Math.max(0,Math.min(2,(parseInt(location.hash.slice(1))||1)-1)));requestAnimationFrame(frame);
</script>
</body>
</html>
