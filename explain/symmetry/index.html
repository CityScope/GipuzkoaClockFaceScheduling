<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Why Symmetry</title>
<meta name="description" content="A grid of four hubs: local coordination without symmetry versus a symmetric clock-face timetable.">
<style>
:root{--ink:#1d2433;--mute:#5d6678;--line:#dfe3ea;--bg:#f6f7fa;--card:#fff;--soft:#eef1f6;--link:#1d4ed8;--ok:#16a34a;--bad:#dc2626;--rail:#d32f2f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8ebf2;--mute:#a3abba;--line:#2e3646;--bg:#161b25;--card:#1f2633;--soft:#262e3d;--link:#93b4ff;--ok:#22c55e;--bad:#f87171;--rail:#ef5350}}
:root[data-theme="dark"]{--ink:#e8ebf2;--mute:#a3abba;--line:#2e3646;--bg:#161b25;--card:#1f2633;--soft:#262e3d;--link:#93b4ff;--ok:#22c55e;--bad:#f87171;--rail:#ef5350}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:22px 16px 40px}
a{color:var(--link)}
h1{font-size:24px;margin:6px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 14px system-ui,sans-serif;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
svg{display:block;width:100%;height:auto;background:var(--soft)}
svg text{font-family:system-ui,sans-serif}
.cap{padding:12px 16px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.cap p{margin:0;color:var(--mute);flex:1 1 320px}
.score{font-size:20px;font-weight:800}
.score.ok{color:var(--ok)}.score.bad{color:var(--bad)}
</style>
</head>
<body>
<main>
<a href="../../index.html">← all regions and explainers</a>
<h1>Why symmetry, not just coordination</h1>
<div class="tabs"><button data-s="0" class="on">Coordination only</button><button data-s="1">Symmetric</button></div>
<div class="stage">
<svg id="sv" viewBox="0 0 700 540" role="img" aria-label="Four hubs in a square grid with trains running every hour"></svg>
<div class="cap"><span class="score" id="score"></span><p id="txt"></p></div>
</div>
</main>
<script>
const NS='http://www.w3.org/2000/svg',sv=document.getElementById('sv');
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||sv).appendChild(e);return e;};
const mod=(x,n)=>((x%n)+n)%n,mm=(x)=>':'+String(mod(Math.round(x),60)).padStart(2,'0');
// four hubs in a square; one train per hour and direction on each edge; every train leaves its hub 3' after the hub minute;
// a change is timed when the train arrives within 3' of the hub minute (wait <= 6')
const P={A:[150,150],B:[550,150],C:[550,410],D:[150,410]},ORDER=['A','B','C','D'],cx=350,cy=280;
const SC=[
 {tt:{AB:17,BC:23,CD:19,DA:26},h:{A:0,B:20,C:46,D:8},
  txt:'Each hub is timed for the train coming round clockwise, and every edge has its own travel time. Back at A the loop does not close, and in the other direction almost nothing connects.'},
 {tt:{AB:24,BC:24,CD:24,DA:24},h:{A:0,B:30,C:0,D:30},
  txt:'Every edge takes 24′ (half an hour minus the change), so the hubs alternate :00 / :30. Arrivals mirror departures around each hub minute, so the loop closes and every change works in both directions.'}
];
let T=0,last=0,dyn=null;
const edges=(sc)=>ORDER.map((a,i)=>{const b=ORDER[(i+1)%4];return {a,b,tt:sc.tt[a+b]};});
function build(i){sv.innerHTML='';const sc=SC[i],E=edges(sc);
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.s===i));
 const tr=[];for(const e of E)for(const [o,d] of [[e.a,e.b],[e.b,e.a]])tr.push({o,d,tt:e.tt,dep:sc.h[o]+3,arr:sc.h[o]+3+e.tt});
 const wait=(t)=>mod(sc.h[t.d]+3-t.arr,60);   // arrive, change, leave on the other edge at hub + 3'
 const good=tr.filter(t=>wait(t)<=6).length;
 const s=document.getElementById('score');s.textContent=`${good} of 8 changes timed`;s.className='score '+(good===8?'ok':'bad');
 document.getElementById('txt').textContent=sc.txt;
 const gE=el('g',{}),gT=el('g',{}),gN=el('g',{});
 for(const e of E){const [ax,ay]=P[e.a],[bx,by]=P[e.b];
  el('line',{x1:ax,y1:ay,x2:bx,y2:by,stroke:'var(--rail)','stroke-width':6,'stroke-linecap':'round',opacity:.3},gE);
  const mx=(ax+bx)/2,my=(ay+by)/2,ox=mx-cx,oy=my-cy,L=Math.hypot(ox,oy);
  el('text',{x:mx-ox/L*34,y:my-oy/L*34+6,'text-anchor':'middle','font-size':19,'font-weight':800,fill:'var(--ink)'},gE).textContent=e.tt+'′';}
 for(const t of tr){const [ax,ay]=P[t.o],[bx,by]=P[t.d],L=Math.hypot(bx-ax,by-ay);
  t.px=-(by-ay)/L*9;t.py=(bx-ax)/L*9;t.ok=wait(t)<=6;   // the two directions run side by side
  t.r=el('rect',{width:34,height:13,rx:4,fill:'var(--rail)',stroke:'var(--card)','stroke-width':1.5},gT);}
 const hubs=[];
 for(const n of ORDER){const [x,y]=P[n],g=el('g',{transform:`translate(${x},${y})`},gN),up=y<cy;
  const ring=el('circle',{r:40,fill:'none','stroke-width':5,opacity:0},g);
  el('circle',{r:31,fill:'var(--card)',stroke:'var(--ink)','stroke-width':2.2},g);
  for(let k=0;k<12;k++){const a=k/12*2*Math.PI;el('line',{x1:Math.sin(a)*26,y1:-Math.cos(a)*26,x2:Math.sin(a)*30,y2:-Math.cos(a)*30,stroke:'var(--mute)','stroke-width':1.2},g);}
  const ha=sc.h[n]/60*2*Math.PI;el('line',{x1:0,y1:0,x2:Math.sin(ha)*25,y2:-Math.cos(ha)*25,stroke:'var(--ink)','stroke-width':5,'stroke-linecap':'round'},g);
  const mh=el('line',{x1:0,y1:0,x2:0,y2:-27,stroke:'var(--bad)','stroke-width':2.2,'stroke-linecap':'round'},g);
  el('circle',{r:3,fill:'var(--ink)'},g);
  const y0=up?-52:64;el('text',{x:0,y:y0,'text-anchor':'middle','font-size':16,'font-weight':800,fill:'var(--ink)'},g).textContent=`${n} · hub ${mm(sc.h[n])}`;
  tr.filter(t=>t.d===n).forEach((t,k)=>{const w=wait(t),ok=w<=6;
   el('text',{x:0,y:y0+(up?-19:19)*(k+1),'text-anchor':'middle','font-size':13.5,'font-weight':700,fill:ok?'var(--ok)':'var(--bad)'},g).textContent=`from ${t.o}: ${ok?'✓':'✗'} wait ${w}′`;});
  hubs.push({n,mh,ring});}
 dyn=(m)=>{const t=mod(m,60);
  for(const x of tr){const f=mod(t-x.dep,60)/x.tt;if(f>1){x.r.setAttribute('opacity',0);continue;}
   const [ax,ay]=P[x.o],[bx,by]=P[x.d],X=ax+(bx-ax)*f+x.px,Y=ay+(by-ay)*f+x.py,ang=Math.atan2(by-ay,bx-ax)*180/Math.PI;
   x.r.setAttribute('opacity',1);x.r.setAttribute('transform',`translate(${X},${Y}) rotate(${ang}) translate(-17,-6.5)`);}
  for(const hb of hubs){const a=t/60*2*Math.PI;hb.mh.setAttribute('x2',Math.sin(a)*27);hb.mh.setAttribute('y2',-Math.cos(a)*27);
   let st=null;for(const x of tr)if(x.d===hb.n&&mod(t-x.arr,60)<=4)st=(st===false?false:x.ok);   // flash green / red when a train arrives
   hb.ring.setAttribute('opacity',st==null?0:.9);hb.ring.setAttribute('stroke',st?'var(--ok)':'var(--bad)');}};}
function frame(ts){const dt=last?(ts-last)/1000:0;last=ts;T+=dt*4;if(dyn)dyn(T);requestAnimationFrame(frame);}   // 4 timetable minutes per second
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{build(+b.dataset.s);history.replaceState(null,'','#'+(+b.dataset.s+1));});
build(location.hash==='#2'?1:0);requestAnimationFrame(frame);
</script>
</body>
</html>
