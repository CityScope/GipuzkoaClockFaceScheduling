name: file size check
on: [push, pull_request]
jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No file above 50 MB, warn above 10 MB
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            s=$(stat -c %s "$f")
            if [ "$s" -gt $((50*1024*1024)) ]; then echo "::error file=$f::$f is $((s/1024/1024)) MB (limit 50 MB)"; fail=1
            elif [ "$s" -gt $((10*1024*1024)) ]; then echo "::warning file=$f::$f is $((s/1024/1024)) MB (above 10 MB)"; fi
          done < <(git ls-files -z)
          exit $fail
